<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Автономера</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#0b0e17;color:#fff;font-family:-apple-system,system-ui,sans-serif;padding:12px 12px 90px;overflow-x:hidden}
.top{display:flex;justify-content:space-between;align-items:flex-end}
.bal{font-size:28px;font-weight:800}.lv{background:#1a2133;border-radius:20px;padding:6px 12px}
.bar{height:5px;background:#1a2133;border-radius:3px;margin:8px 0 12px;overflow:hidden}.bar i{display:block;height:100%;background:#8b5cf6;border-radius:3px;transition:width .6s}
.card{background:#141a2a;border-radius:16px;padding:14px;margin-bottom:10px}
.plate{--c:#fff;background:#fff;color:#000;border:3px solid #000;border-radius:10px;display:flex;font-weight:800;margin:6px auto;max-width:360px;transition:box-shadow .4s}
.pn{flex:1;text-align:center;font-size:34px;padding:10px 4px;white-space:nowrap;display:flex;justify-content:center;gap:2px}
.c{display:inline-block;min-width:.62em;transition:transform .2s}
.c.spin{filter:blur(1.5px);opacity:.75;transform:translateY(-2px)}
.c.lock{animation:pop .35s cubic-bezier(.2,1.6,.4,1)}
.sp{width:.35em}
.pr{border-left:3px solid #000;padding:4px 10px;text-align:center;font-size:26px;display:flex;flex-direction:column;justify-content:center}
.pr small{font-size:11px}
.plate.drop{animation:drop .5s cubic-bezier(.2,1.4,.4,1)}
.plate.glow{box-shadow:0 0 26px var(--c);animation:drop .5s cubic-bezier(.2,1.4,.4,1),pulse 1.6s ease-in-out .5s infinite alternate}
.sm .pn{font-size:20px;padding:6px}.sm .pr{font-size:15px;padding:2px 6px}.sm{margin:0;max-width:200px;border-width:2px}
#rar{text-align:center;font-weight:700;min-height:24px;transition:opacity .3s}
.row{display:flex;gap:8px}.row>*{flex:1}
button,select{font-size:16px;border:0;border-radius:12px;padding:13px;color:#fff;background:#2b6cf6;width:100%;margin-top:8px;transition:transform .12s,opacity .2s}
button:active{transform:scale(.96)}
button.g{background:#22a95a}button.d{background:#2a3350}button.o{background:#c77a12}button:disabled{opacity:.4}
select{background:#1a2133}
.st{background:#1a2133;padding:10px 4px;font-size:13px;text-align:center;border-radius:10px;transition:outline-color .2s,transform .15s;outline:2px solid transparent}.st.on{outline-color:#ffb020;transform:translateY(-2px)}
.it{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid #1f2740;max-height:140px;overflow:hidden;transition:all .26s;animation:fade .3s}
.it.rm{max-height:0;opacity:0;padding:0;transform:translateX(60px)}
.it .bt{display:flex;flex-direction:column;gap:6px}.it button{width:auto;margin:0;padding:9px 12px;font-size:14px}
.k{font-size:12px;color:#8a97b0}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;gap:6px;padding:8px 12px calc(8px + env(safe-area-inset-bottom));background:#0b0e17;z-index:5}
.tabs button{margin:0;padding:12px 0;background:#1a2133;font-size:14px}.tabs button.on{background:#2b6cf6}
.v{display:none}.v.on{display:block;animation:fade .28s}
.pg{height:6px;background:#1a2133;border-radius:3px;margin:6px 0;overflow:hidden}.pg i{display:block;height:100%;background:#22a95a;transition:width .5s}
#toasts{position:fixed;top:calc(env(safe-area-inset-top) + 6px);left:12px;right:12px;z-index:60;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{background:#1c2438;border:2px solid #2b6cf6;border-radius:14px;padding:11px 14px;font-weight:600;text-align:center;box-shadow:0 6px 20px #0008;animation:tin .4s cubic-bezier(.2,1.4,.4,1);transition:all .35s}
.toast.big{font-size:18px;padding:16px}.toast.out{opacity:0;transform:translateY(-14px)}
.cf{position:fixed;top:-30px;font-size:22px;pointer-events:none;z-index:50;animation:fall 1.9s ease-in forwards}
@keyframes pop{0%{transform:scale(1.7) translateY(-8px);opacity:.3}100%{transform:none;opacity:1}}
@keyframes drop{0%{transform:scale(.7) translateY(-24px);opacity:.4}60%{transform:scale(1.08)}100%{transform:none;opacity:1}}
@keyframes pulse{to{box-shadow:0 0 42px var(--c)}}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes tin{from{opacity:0;transform:translateY(-30px) scale(.9)}to{opacity:1;transform:none}}
@keyframes fall{to{transform:translateY(105vh) rotate(420deg);opacity:.2}}
</style></head><body>
<div id="toasts"></div>
<div class="top"><div><div class="k">Баланс</div><div class="bal" id="coins">0 ₽</div></div><div class="lv" id="lv">Ур. 1</div></div>
<div class="bar"><i id="xp" style="width:0"></i></div>

<div class="v on" id="v0">
 <div class="card"><div class="plate" id="pl"><div class="pn" id="pn"></div><div class="pr"><b id="rg">??</b><small>RUS</small></div></div>
 <div id="rar"></div>
 <div id="res" style="display:none"><div class="row"><button class="g" id="bs">Продать</button><button class="d" id="bk">В инвентарь</button></div></div></div>
 <div class="card"><div class="row" id="stakes"></div>
 <select id="reg"></select>
 <label class="k" style="display:block;margin-top:8px"><input type="checkbox" id="fr" checked> Тратить бесплатные крутки (<span id="fc">0</span>), только обычная без региона</label>
 <button id="spin">Крутить</button></div>
</div>

<div class="v" id="v1"><div class="card">
 <div>Номеров: <b id="gc">0</b> · оценка <b id="gw">0</b> ₽</div>
 <div class="k">⚡ Апгрейд: платите 25% цены, при успехе номер становится редкостью выше, при неудаче сгорает</div>
 <button class="g" id="cheap">Продать все обычные и редкие</button></div>
 <div class="card" id="gl"></div></div>

<div class="v" id="v2">
 <div class="card"><b>🎁 Бонус дня</b><div class="k" id="dk">Чем больше дней подряд, тем больше награда (до 7 дня)</div><button id="bd">Забрать</button></div>
 <div class="card"><b>🎡 Рулетка</b><div class="k">раз в 3 часа</div><button id="bw">Крутить рулетку</button></div>
 <div class="card"><b>📋 Задания дня</b><div id="tk"></div></div></div>

<div class="v" id="v3"><div class="card" id="tl"></div></div>

<div class="tabs"><button class="on" data-t="0">🎰 Игра</button><button data-t="1">🚘 Инвентарь</button><button data-t="2">🎁 Бонусы</button><button data-t="3">🏆 Топ</button></div>

<script>
var tg=window.Telegram&&window.Telegram.WebApp;if(tg){tg.ready();tg.expand();}
var $=function(i){return document.getElementById(i)};
var NM=['Обычный','Необычный','Редкий','Эпик','Легендарный','Мифик'];
var COL=['#9aa7b4','#4cd964','#4aa8ff','#b45cff','#ffb020','#ff4d6d'];
var LET='АВЕКМНОРСТУХ',S=null,busy=false,stake='n',cur=0,shown=0,bt=0;
function fm(n){return String(n).replace(/\B(?=(\d{3})+(?!\d))/g,' ')}
function hap(t){try{if(t=='heavy')tg.HapticFeedback.impactOccurred('heavy');else if(t=='tick')tg.HapticFeedback.selectionChanged();else tg.HapticFeedback.notificationOccurred(t)}catch(e){}}
function fp(p){return p.charAt(0)+' '+p.slice(1,4)+' '+p.slice(4)}
function plate(p,r){return '<div class="plate sm"><div class="pn">'+fp(p)+'</div><div class="pr"><b>'+r+'</b><small>RUS</small></div></div>'}
function setPlate(p,r){var h='';for(var i=0;i<6;i++){h+='<span class="c">'+p.charAt(i)+'</span>';if(i==0||i==3)h+='<span class="sp"></span>'}$('pn').innerHTML=h;$('rg').textContent=r}
function rc(i){return(i==0||i>=4)?LET.charAt(Math.floor(Math.random()*12)):String(Math.floor(Math.random()*10))}
function toast(t,col,big){var d=document.createElement('div');d.className='toast'+(big?' big':'');d.textContent=t;if(col)d.style.borderColor=col;$('toasts').appendChild(d);
 setTimeout(function(){d.className+=' out'},big?3400:2300);setTimeout(function(){d.remove()},big?3800:2700)}
function confetti(n){var e=['✨','🎉','⭐','💎'];for(var i=0;i<n;i++){var d=document.createElement('div');d.className='cf';d.textContent=e[i%4];
 d.style.left=Math.random()*100+'vw';d.style.animationDelay=Math.random()*.5+'s';document.body.appendChild(d);(function(x){setTimeout(function(){x.remove()},2600)})(d)}}
function animBal(to){var from=shown,t0=Date.now();clearInterval(bt);bt=setInterval(function(){var k=Math.min(1,(Date.now()-t0)/600);
 shown=Math.round(from+(to-from)*k);$('coins').textContent=fm(shown)+' ₽';if(k>=1)clearInterval(bt)},30)}
function call(a,p){return fetch('/api/'+a,{method:'POST',headers:{'Content-Type':'application/json'},
 body:JSON.stringify({initData:tg?tg.initData:'',p:p||{}})}).then(function(r){return r.text()})
 .then(function(t){try{return JSON.parse(t)}catch(e){return{error:'Ошибка сервера'}}}).catch(function(){return{error:'Нет связи'}})}
function tm(s){return Math.floor(s/3600)+' ч '+Math.floor(s%3600/60)+' мин'}
function render(s){
 S=s;animBal(s.coins);$('lv').textContent='Ур. '+s.level;
 $('xp').style.width=Math.min(100,(s.xp-s.xp_lo)/(s.xp_hi-s.xp_lo)*100)+'%';
 $('fc').textContent=s.free;$('gc').textContent=s.count;$('gw').textContent=fm(s.worth);
 if(!$('reg').options.length){var o='<option value="">Любой регион</option>';
  s.cfg.regions.forEach(function(r){o+='<option value="'+r+'">'+(s.cfg.beauty.indexOf(r)>=0?'⭐ ':'')+r+'</option>'});$('reg').innerHTML=o;
  var h='';[['n','Обычная'],['p','Премиум'],['e','Элитная']].forEach(function(x){h+='<div class="st" data-s="'+x[0]+'">'+x[1]+'<br><b>'+fm(s.cfg.stakes[x[0]])+' ₽</b></div>'});
  $('stakes').innerHTML=h;pick('n')}
 var g='';s.plates.forEach(function(p){var up=p.rar<5?'<button class="o" data-up="'+p.id+'">⚡ '+Math.round(s.cfg.up[p.rar]*100)+'% · '+fm(Math.floor(p.value*s.cfg.up_cost))+'</button>':'';
  g+='<div class="it"><div>'+plate(p.plate,p.region)+'<div class="k" style="color:'+COL[p.rar]+'">'+NM[p.rar]+' · '+fm(p.value)+' ₽</div></div><div class="bt"><button class="g" data-id="'+p.id+'">+'+fm(Math.floor(p.value*(1-s.fee)))+'</button>'+up+'</div></div>'});
 $('gl').innerHTML=g||'<div class="k">Инвентарь пуст</div>';
 $('bd').disabled=s.daily_in>0;$('bw').disabled=s.wheel_in>0;
 $('bd').textContent=s.daily_in>0?'Через '+tm(s.daily_in):'Забрать +'+fm(s.daily_reward)+' ₽ (день '+s.daily_streak+')';
 $('bw').textContent=s.wheel_in>0?'Через '+tm(s.wheel_in):'Крутить рулетку';
 var t='';s.tasks.forEach(function(k){var rw=(k.rw.coins?'+'+fm(k.rw.coins)+' ₽ ':'')+(k.rw.free?'+'+k.rw.free+' беспл.':'');
  t+='<div style="margin-top:10px">'+k.name+' <span class="k">'+k.have+'/'+k.need+' · '+rw+'</span><div class="pg"><i style="width:'+(k.have/k.need*100)+'%"></i></div>'+
  (k.claimed?'<div class="k">✅ Получено</div>':(k.have>=k.need?'<button class="g" data-task="'+k.id+'">Забрать</button>':''))+'</div>'});
 $('tk').innerHTML=t;upd()}
function pick(k){stake=k;[].forEach.call(document.querySelectorAll('.st'),function(e){e.className='st'+(e.dataset.s==k?' on':'')});hap('tick');upd()}
function upd(){if(!S)return;var r=$('reg').value,c=S.cfg.stakes[stake];if(r)c=Math.floor(c*(S.cfg.beauty.indexOf(r)>=0?1.4:1.2));$('spin').textContent='Крутить · '+fm(c)+' ₽'}
function lu(r){if(r.levelup){toast('⭐ Уровень '+r.levelup.level+'! +'+fm(r.levelup.reward)+' ₽','#ffb020',1);confetti(14)}}
function spin(){if(busy)return;busy=true;$('res').style.display='none';$('rar').style.opacity=0;$('pl').className='plate';$('rg').textContent='??';
 var cs=$('pn').querySelectorAll('.c'),lock=[0,0,0,0,0,0],t0=Date.now();
 var iv=setInterval(function(){for(var i=0;i<6;i++)if(!lock[i]){cs[i].textContent=rc(i);cs[i].className='c spin'}},60);
 call('spin',{stake:stake,region:$('reg').value,free:$('fr').checked}).then(function(r){
  setTimeout(function(){
   if(r.error){clearInterval(iv);busy=false;setPlate('??????','??');toast('⚠️ '+r.error,'#ff4d6d');hap('error');return}
   var s=r.spin;
   for(var i=0;i<6;i++)(function(i){setTimeout(function(){lock[i]=1;cs[i].textContent=s.plate.charAt(i);cs[i].className='c lock';hap('tick')},i*200)})(i);
   setTimeout(function(){clearInterval(iv);reveal(r)},1300)},Math.max(0,800-(Date.now()-t0)))})}
function reveal(r){var s=r.spin;cur=s.id;$('rg').textContent=s.region;var p=$('pl');p.style.setProperty('--c',COL[s.rar]);
 p.className='plate drop'+(s.rar>=1?' glow':'');
 $('rar').innerHTML='<span style="color:'+COL[s.rar]+'">'+NM[s.rar]+'</span> · '+fm(s.value)+' ₽';$('rar').style.opacity=1;
 $('bs').textContent='Продать · '+fm(s.sell)+' ₽';$('res').style.display='block';
 if(s.rar>=3){toast('🔥 Выпал '+NM[s.rar]+'! '+fm(s.value)+' ₽',COL[s.rar],1);confetti(s.rar>=4?44:22);hap('heavy')}
 else if(s.rar==2){toast('✨ Редкий номер · '+fm(s.value)+' ₽',COL[2]);hap('success')}
 render(r);lu(r);busy=false}
function tab(n){[0,1,2,3].forEach(function(i){$('v'+i).className='v'+(i==n?' on':'')});
 [].forEach.call(document.querySelectorAll('.tabs button'),function(b,i){b.className=i==n?'on':''});hap('tick');
 if(n==3)call('top').then(function(r){var h='';(r.top||[]).forEach(function(u,i){h+='<div class="it"><div>'+['🥇','🥈','🥉'][i]+(i>2?(i+1)+'.':'')+' '+u.name+(u.me?' (вы)':'')+'</div><b>'+fm(u.cap)+' ₽</b></div>'});$('tl').innerHTML=h})}
function simple(a,p){call(a,p).then(function(r){if(r.error){toast('⚠️ '+r.error,'#ff4d6d');hap('error');return}
 if(r.sold){toast('💰 Продано · +'+fm(r.sold)+' ₽','#22a95a');if(cur&&a=='sell')$('res').style.display='none'}
 else if(r.up){if(r.up.ok){toast('⚡ Апгрейд удался! '+NM[r.up.rar]+' · '+fm(r.up.value)+' ₽',COL[r.up.rar],1);if(r.up.rar>=3)confetti(26);hap('success')}
  else{toast('💥 Не повезло, номер '+fp(r.up.old)+' сгорел','#ff4d6d');hap('error')}}
 else if(r.msg){toast('🎁 '+r.msg,'#ffb020');hap('success')}
 render(r);lu(r)})}
function ask(m,cb){if(tg&&tg.showConfirm)tg.showConfirm(m,function(ok){if(ok)cb()});else if(confirm(m))cb()}
document.addEventListener('click',function(e){var t=e.target.closest('[data-t],[data-s],[data-id],[data-up],[data-task]');if(!t)return;var d=t.dataset;
 if(d.t!==undefined)tab(+d.t);else if(d.s)pick(d.s);
 else if(d.id){var it=t.closest('.it');it.className+=' rm';setTimeout(function(){simple('sell',{id:d.id})},260)}
 else if(d.up)ask('Апгрейд: '+t.textContent.replace('⚡','')+' ₽. При неудаче номер сгорит. Продолжить?',function(){simple('upgrade',{id:d.up})});
 else if(d.task)simple('task',{id:d.task})});
$('reg').onchange=upd;$('spin').onclick=spin;
$('bs').onclick=function(){$('res').style.display='none';simple('sell',{id:cur})};
$('bk').onclick=function(){$('res').style.display='none';toast('🚘 Номер в инвентаре','#2b6cf6')};
$('cheap').onclick=function(){simple('sell',{})};$('bd').onclick=function(){simple('daily')};$('bw').onclick=function(){simple('wheel')};
setPlate('??????','??');
call('state').then(function(r){if(r.error){toast('⚠️ '+r.error+'. Откройте игру через бота.','#ff4d6d',1);return}shown=r.coins;render(r)});
setInterval(function(){if(!S)return;if(S.daily_in>0)S.daily_in--;if(S.wheel_in>0)S.wheel_in--},1000);
</script></body></html>
